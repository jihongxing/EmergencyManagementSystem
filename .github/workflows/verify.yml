name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Install web dependencies
        working-directory: apps/admin-web
        run: npm ci
      - name: Install contract validation dependencies
        working-directory: scripts/contracts
        run: npm ci
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Preflight
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test/preflight.ps1
