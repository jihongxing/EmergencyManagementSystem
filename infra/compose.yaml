name: ems-dev
services:
  postgres:
    image: docker.io/library/postgres@sha256:dbbeb22a65db2503050cdbbe5e78f017478f10a1002a226463f049dbb017e99b
    environment:
      POSTGRES_DB: emergency_dev
      POSTGRES_USER: emergency_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55472}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency_dev -d emergency_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
